# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # No generation step is needed here: the hook in mkdocs.yml
  # (scripts/mkdocs_hooks.py) generates the reference pages before building, so
  # they are always those of the version being built.

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
