#:schema https://codeberg.org/lektra/lektra/raw/branch/main/schema/lektra-config.schema.json
# =============================================================================
# LEKTRA default configuration
#
# This file lists every configuration option that LEKTRA's TOML parser
# understands (src/Lektra.cpp), with the default value taken from
# include/Config.hpp. Keys and sections that are not shown here are ignored
# by the parser — LEKTRA does not fail on unknown keys.
#
# You can override any subset of these keys in your own config file —
# sections you omit fall back to the defaults compiled into the binary.
#
# Editor completion and checking: the line at the very top of this file points a
# TOML language server (Taplo: VS Code "Even Better TOML", Neovim, Helix, Zed)
# at Lektra's JSON Schema. Keep that line in your own config.toml to get
# completion, hover documentation and warnings for typos and wrong values.
#
# Config file location:
#   Linux / macOS : $HOME/.config/lektra/config.toml
#   Windows       : %APPDATA%\lektra\config.toml
#                   (typically C:\Users\<user>\AppData\Roaming\lektra\)
#
# The Lua init file, if you use one, sits next to config.toml as init.lua.
#
# See the full commented reference at:
#   https://dheerajshenoy.github.io/lektra/configuration
# =============================================================================


# -----------------------------------------------------------------------------
# [window] — Main window
# -----------------------------------------------------------------------------
[window]
fullscreen       = false
menubar          = true
show_menu_icons  = true   # standard-style icons next to menubar items
startup_tab      = false
title_format     = "%1 - lektra"
initial_size     = { width = 600, height = 400 }
accent           = "#3daee9FF"
bg               = "#00000000"


# -----------------------------------------------------------------------------
# [page] — Rendered page background/foreground (foreground used in invert mode)
# -----------------------------------------------------------------------------
[page]
bg = "#FFFFFFFF"
fg = "#000000FF"


# -----------------------------------------------------------------------------
# [layout] — Multi-page layout / initial fit
# -----------------------------------------------------------------------------
[layout]
mode        = "vertical"   # vertical | horizontal | single | book | grid
initial_fit = "width"      # width | height | window
auto_resize = false        # re-run the fit when the view resizes
spacing     = 10           # gap between pages in pixels
grid_columns = 3           # pages per row in the grid layout


# -----------------------------------------------------------------------------
# [zoom]
# -----------------------------------------------------------------------------
[zoom]
level           = 0.5      # initial zoom factor
factor          = 1.25     # zoom_in / zoom_out multiplier
anchor_to_mouse = true     # zoom under the cursor instead of view centre


# -----------------------------------------------------------------------------
# [statusbar]
# -----------------------------------------------------------------------------
[statusbar]
visible = true
padding = [ 2, 2, 2, 2 ]   # left, top, right, bottom (pixels); a single number, e.g. 4, sets all four

# Which modules the statusbar shows and where. Modules: session, filename, page,
# zoom, progress, mode, portal, narrow. A module that is not listed is not shown.
#
# Items go from left to right. The free space goes to the gaps:
#   "|"                a gap that takes all of it
#   { stretch = 2 }    a gap with twice the share of another one
#   { spacer = 12 }    a gap of 12 pixels
# A module can be a table to say more about it:
#   { module = "filename", stretch = 1, min_width = 80, max_width = 400,
#     margin = 4, align = "right" }          # stretch: it takes a share of the free space
#   { module = "page", at = 0.5, anchor = "center" }   # at a fixed spot: 0 to 1 along the bar
#   { text = "|" }                           # a piece of text, e.g. a separator
# A list of lists is several rows.
#
# This is the default:
layout = [ "session", "filename", "portal", "narrow", "|", "progress", "mode",
           { module = "page", at = 0.5, anchor = "center" } ]
#
# Examples:
#   layout = [ "filename", "|", "page", "zoom", "|", "mode" ]               # page and zoom in the middle
#   layout = [ "mode", { text = "|" }, "page", { stretch = 1 }, "filename" ]
#   layout = [ [ "filename", "|", "session" ], [ "page", "|", "zoom", "progress" ] ]   # two rows

[statusbar.components.mode]
show = true
text = true
icon = true

[statusbar.components.pagenumber]
show = true

[statusbar.components.session]
show = true

[statusbar.components.zoom]
show = true

[statusbar.components.filename]
show      = true
full_path = true

[statusbar.components.progress]
show = true


# -----------------------------------------------------------------------------
# [tabs]
# -----------------------------------------------------------------------------
[tabs]
visible    = true
auto_hide  = false          # hide the tab bar when only one tab is open
close_button_mode = "all"  # all | current | hidden
movable    = true
elide_mode = "right"        # right | left | middle | none
location   = "top"          # top | bottom | left | right
full_path  = false          # show the full file path in the tab label
lazy_load  = true           # only materialise a tab's view when it becomes current
open_position = "end"       # end | start | after_current
scroll_text_on_hover = false  # scroll a title that does not fit while the mouse is over the tab
min_width  = 0              # narrowest a tab may be, in pixels (0: no limit)
max_width  = 0              # widest a tab may be, in pixels (0: no limit)


# -----------------------------------------------------------------------------
# [split]
# -----------------------------------------------------------------------------
[split]
focus_follows_mouse      = true
mouse_follows_focus      = true
dim_inactive             = false
dim_inactive_opacity     = 0.5     # 0.0 (no dim) - 1.0 (full dim)
focus_border             = false
focus_border_color       = "#FF4FC3F7"
focus_border_width       = 2
maximize_indicator       = true
maximize_indicator_color = "#CC2979FF"


# -----------------------------------------------------------------------------
# [portal] — Picture-in-picture linked view
# -----------------------------------------------------------------------------
[portal]
enabled        = true
border_color   = "#FFFFFFAA"
border_width   = 5
respect_parent = true
dim_inactive   = false
split          = "vertical"   # vertical | horizontal | smart


# -----------------------------------------------------------------------------
# [preview] — Floating link-preview window
# -----------------------------------------------------------------------------
[preview]
size_ratio             = { width = 0.6, height = 0.7 }
border_radius          = 8
close_on_click_outside = true
opacity                = 0.95


# -----------------------------------------------------------------------------
# [thumbnail_panel]
# -----------------------------------------------------------------------------
[thumbnail_panel]
show_page_numbers      = true
panel_width            = 0.15      # fraction of the main view
font_size              = 10
highlight_current_page = true
sync_scroll            = true


# -----------------------------------------------------------------------------
# [scrollbars]
# -----------------------------------------------------------------------------
[scrollbars]
vertical     = true
horizontal   = true
search_hits  = true
auto_hide    = true
size         = 12
hide_timeout = 1.5     # seconds of inactivity before hiding


# -----------------------------------------------------------------------------
# [outline]
# -----------------------------------------------------------------------------
[outline]
indent_width      = 10
show_page_numbers = true
flat_menu         = true
preload           = false  # true: load the outline after the document opens; false: on first use
# Picker.shared knobs also apply here — width, height, border,
# alternating_row_color, prompt, shadow.*  (see [picker] below).


# -----------------------------------------------------------------------------
# [picker] — Base defaults for every list-picker (outline, highlight search,
# command palette, file/recent/bookmark pickers). The individual pickers
# below can override any of these keys.
# -----------------------------------------------------------------------------
[picker]
width                 = 600       # pixels if > 1, fraction of window width otherwise
height                = 400
border                = true
alternating_row_color = true

[picker.shadow]
enabled     = true
blur_radius = 18
offset_x    = 0
offset_y    = 6
opacity     = 120


# -----------------------------------------------------------------------------
# [command_palette]
# -----------------------------------------------------------------------------
[command_palette]
description        = false
vscrollbar          = true
show_shortcuts      = true
prompt              = "Command"
sort_by_frequency   = true
persist_frequency   = true


# -----------------------------------------------------------------------------
# [highlight_search] — the picker opened with :picker_highlight_search
# -----------------------------------------------------------------------------
[highlight_search]
flat_menu = true


# -----------------------------------------------------------------------------
# [annotations]
# -----------------------------------------------------------------------------
[annotations.highlight]
color             = "#55FF5588"
hover_glow        = true
glow_color        = "#FF5000AA"
glow_width        = 5
comment           = true
comment_marker    = true
comment_font_size = 12

[annotations.rect]
color             = "#55FF5588"
hover_glow        = true
glow_color        = "#FF5000AA"
glow_width        = 5
comment           = true
comment_marker    = true
comment_font_size = 12

[annotations.popup]
hover_glow        = true
glow_color        = "#FF5000AA"
glow_width        = 5
comment           = true
comment_font_size = 12


# -----------------------------------------------------------------------------
# [reflow]  (text style for EPUB, FB2, MOBI, HTML)
# -----------------------------------------------------------------------------
[reflow]
# font_family  = ""      # any installed font, or serif / sans-serif / monospace;
#                        # empty keeps the document's own fonts
# font_size    = 11.0    # points
# line_spacing = 0.0     # multiple of the font size, e.g. 1.4; 0 keeps the document's own


# -----------------------------------------------------------------------------
# [selection]
# -----------------------------------------------------------------------------
[selection]
drag_threshold  = 50        # pixels before a click becomes a drag
copy_on_select  = false
color           = "#0000FF55"


# -----------------------------------------------------------------------------
# [search]
# -----------------------------------------------------------------------------
[search]
highlight_matches = true
progressive       = true    # stream results as pages are searched
absolute_jump     = false   # "next" is the next result index, not physically nearest
match_color       = "#55500033"
index_color       = "#55FF0055"


# -----------------------------------------------------------------------------
# [jump_marker]
# -----------------------------------------------------------------------------
[jump_marker]
enabled       = true
jump_marker   = "#FF0000FF"   # colour of the marker
fade_duration = 1.0           # seconds


# -----------------------------------------------------------------------------
# [links]
# -----------------------------------------------------------------------------
[links]
enabled     = true                               # master switch for PDF links + detected URLs
boundary    = false                              # show the clickable rect boundary
detect_urls = false                              # find bare URLs in the page text
url_regex = '''(https?://|www\.)[^\s<>()"']+''' # used when detect_urls = true
hover_preview        = false  # hovering an internal link shows a preview of its target
hover_preview_delay  = 350    # ms to hover before the preview shows
hover_preview_width  = 480    # preview size in pixels
hover_preview_height = 240


# -----------------------------------------------------------------------------
# [link_hints] — the on-screen labels shown by :link_hint_visit
# -----------------------------------------------------------------------------
[link_hints]
size = 0.5             # hint rect size, relative to link size
bg   = "#000000FF"
fg   = "#EA3EE9FF"


# -----------------------------------------------------------------------------
# [synctex] — Forward / reverse search with LaTeX editors (built only with
# WITH_SYNCTEX=ON, which is the default).
# -----------------------------------------------------------------------------
[synctex]
enabled        = true
editor_command = ""    # e.g. "nvim --server /tmp/nvim.pipe --remote-send"


# -----------------------------------------------------------------------------
# [updates] — A newer release, and what changed after an update.
# -----------------------------------------------------------------------------
[updates]
check     = true   # once a day, ask the GitHub releases API for the latest version
whats_new = false  # after an update, a banner that opens the list of changes (Help > What's New always works)


# -----------------------------------------------------------------------------
# [donate] — A rare reminder that Lektra can be supported.
# -----------------------------------------------------------------------------
[donate]
reminders = true   # after a few weeks of use, at most twice a year


# -----------------------------------------------------------------------------
# [rendering]
# -----------------------------------------------------------------------------
[rendering]
backend                 = "raster"   # auto | raster | opengl
antialiasing            = true
text_antialiasing       = true
smooth_pixmap_transform = true
antialiasing_bits       = 8
dpr                     = 1.0        # scalar, OR table keyed by screen name (see below)

# Per-screen DPR override (uncomment and adapt the keys to `xrandr --listactivemonitors`):
# [rendering.dpr]
# "eDP-1"  = 1.5
# "HDMI-A-1" = 1.0


# -----------------------------------------------------------------------------
# [behavior]
# -----------------------------------------------------------------------------
[behavior]
confirm_on_quit       = false
undo_limit            = 25
cache_pages           = 5
mupdf_store_size      = 64        # MB — MuPDF's internal image/glyph store
preload_pages         = 1
auto_reload           = true      # watch the open document on disk and refresh
cache_password        = true      # keep the password for auto-reload
invert_mode           = false     # dark mode
dont_invert_images    = true      # keep photos/diagrams in their original colours
single_instance       = false
remember_last_visited = true      # per-file: reopen at the last visited page
recent_files          = true
num_recent_files      = 10
page_history          = 5         # location history depth per view (parser key: page_history)
auto_scroll           = true      # scroll to keep out-of-view selection visible
close_on_last_tab     = false     # quit LEKTRA when the last tab is closed (confirm_on_quit still applies)
high_contrast              = false   # tone-stretch pass: dark ≤ black_point → 0, light ≥ white_point → 255
high_contrast_black_point  = 40      # 0-255
high_contrast_white_point  = 220     # 0-255


# -----------------------------------------------------------------------------
# [misc]
# -----------------------------------------------------------------------------
[misc]
# Swatches shown in the annotation colour picker.
color_dialog_colors = [
    "#FFFF0080",  # yellow
    "#FFA50080",  # orange
    "#FF000080",  # red
    "#00FF0080",  # green
    "#00C8FF80",  # cyan
    "#8000FF80",  # purple
    "#FF69B480",  # pink
    "#0000FF80",  # blue
    "#FFFFFF80",  # white
]


# -----------------------------------------------------------------------------
# [keybindings]
# -----------------------------------------------------------------------------
# Every action name below must match a command registered with the command
# manager (run `:` to browse). `load_defaults = true` (the default) means
# LEKTRA re-applies the compiled-in defaults after this section is parsed;
# set it to `false` if you want a clean slate and want only the bindings
# you list here.
#
# Values can be either a single key sequence or a list of them:
#   scroll_down = "j"
#   scroll_down = [ "j", "Down" ]
#
# Chord bindings use a comma:
#   split_horizontal = "Ctrl+W,s"
[keybindings]
load_defaults = true

# Movement
scroll_left           = "h"
scroll_down           = "j"
scroll_up             = "k"
scroll_right          = "l"
scroll_down_half_page = "Ctrl+d"
scroll_up_half_page   = "Ctrl+u"

# Pages
page_next  = "Shift+J"
page_prev  = "Shift+K"
page_first = "g,g"
page_last  = "Shift+G"
page_goto  = "Ctrl+g"

# Search
search      = "/"
search_next = "n"
search_prev = "Shift+N"

# Zoom & fit
zoom_in    = "="
zoom_out   = "-"
zoom_reset = "0"
fit_width  = "Ctrl+Shift+W"
fit_height = "Ctrl+Shift+H"
fit_page   = "Ctrl+Shift+="
fit_auto   = "Ctrl+Shift+R"

# History / outline
location_prev           = "Ctrl+o"
location_next           = "Ctrl+i"
picker_outline          = "t"
picker_highlight_search = "Alt+Shift+H"

# Interaction modes
selection_mode_text   = "1"
annot_highlight_mode  = "2"
annot_rect_mode       = "3"
selection_mode_region = "4"
annot_popup_mode      = "5"
visual_line_mode      = "v"

# Caret mode (accessibility: keyboard-driven character-level text cursor,
# cf. Firefox/Okular "caret browsing")
caret_mode         = "F7"
caret_left         = "Left"
caret_right        = "Right"
caret_up           = "Up"
caret_down         = "Down"
caret_line_start   = "Home"
caret_line_end     = "End"
# Shift+J/K also extend the selection (down/up) while caret mode is active
# — handled specially, since those keys are page_next/page_prev otherwise.
caret_select_left  = [ "Shift+Left", "Shift+H" ]
caret_select_right = [ "Shift+Right", "Shift+L" ]
caret_select_up    = "Shift+Up"
caret_select_down  = "Shift+Down"

# Yank (copy) the current selection — works for a mouse selection or a
# caret-mode selection alike
selection_copy = "y"

# Files
link_hint_visit = "f"
file_open_tab   = "o"
file_picker     = "Ctrl+Shift+O"
files_recent    = "Alt+Shift+O"
file_save       = "Ctrl+S"

# Editing / view
undo             = "u"
redo             = "Ctrl+R"
invert_color     = "i"
menubar          = "Ctrl+Shift+M"
command_palette  = ":"
run_last_command = "."
rotate_clock     = ">"
rotate_anticlock = "<"
flip_horizontal  = "|"
flip_vertical    = "_"

# Tabs (Alt+<digit> jumps directly to that tab)
tab_1 = "Alt+1"
tab_2 = "Alt+2"
tab_3 = "Alt+3"
tab_4 = "Alt+4"
tab_5 = "Alt+5"
tab_6 = "Alt+6"
tab_7 = "Alt+7"
tab_8 = "Alt+8"
tab_9 = "Alt+9"

# Splits — Vim-style Ctrl+W chords
split_horizontal  = "Ctrl+W,s"
split_vertical    = "Ctrl+W,v"
split_focus_left  = "Ctrl+W,h"
split_focus_down  = "Ctrl+W,j"
split_focus_up    = "Ctrl+W,k"
split_focus_right = "Ctrl+W,l"
split_close       = "Ctrl+W,c"


# -----------------------------------------------------------------------------
# [mousebindings]
# -----------------------------------------------------------------------------
# Modifier(s)+MouseButton. Valid mouse buttons: LeftButton, RightButton,
# MiddleButton.
[mousebindings]
pan          = "Alt+LeftButton"
preview      = "Alt+Shift+LeftButton"
portal       = "Ctrl+LeftButton"
synctex_jump = "Shift+LeftButton"


# -----------------------------------------------------------------------------
# [picker.keys] — the keys used inside every picker (outline, command palette,
# highlight search, file picker, recent files, bookmarks). Values can be a
# single key or a list.
# -----------------------------------------------------------------------------
[picker.keys]
up                    = [ "Up", "Ctrl+K" ]
down                  = [ "Down", "Ctrl+J" ]
page_up               = "PgUp"
page_down             = "PgDown"
section_prev          = [ "Ctrl+Shift+Up", "Ctrl+Shift+K" ]
section_next          = [ "Ctrl+Shift+Down", "Ctrl+Shift+J" ]
accept                = "Return"
expand                = "Tab"
collapse              = "Tab"
dismiss               = "Escape"
toggle_structure_mode = "Ctrl+Space"
history_prev          = "Ctrl+Up"
history_next          = "Ctrl+Down"

[presentation.laser_pointer]
enabled = false
color = "#FF0000FF"
size = 20

# Per-file-type overrides. Any of the view settings ([page], [layout], [zoom],
# [selection], [reflow], [scrollbars], [search], [jump_marker], [annotations], [links],
# [behavior]) can be set for one document type; the type is lower-case
# (pdf, epub, djvu, ...). Options not listed keep their normal value.
# Dotted keys keep each type in one table:
#
# [filetype.epub]
# layout.mode          = "single"
# behavior.invert_mode = true
#
# [filetype.djvu]
# behavior.high_contrast = true
